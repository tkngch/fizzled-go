version: "2"

linters:
  default: all
  disable:
    - gomodguard  # deprecated
    - wsl  # deprecated
  settings:
    depguard:
      rules:
        # domain should be independent of the transport protocol: protobuf and grpc.
        domain:
          files:
            - $all
            - "!**/internal/server/**"
            - "!**/internal/gen/**"
          allow:
            - $gostd
            - github.com/tkngch/fizzled-go/internal/
        # server is the boundary where the transport protocol is defined.
        server:
          files:
            - "**/internal/server/**"
            - "**/internal/gen/**"
          allow:
            - $gostd
            - github.com/tkngch/fizzled-go/internal/
            - google.golang.org/grpc
            - google.golang.org/protobuf
        # testpki is a test helper, which no production code may import.
        testpki:
          files:
            - "!$test"
          deny:
            - pkg: github.com/tkngch/fizzled-go/internal/testpki
              desc: testpki issues certificates for tests only
    goconst:
      ignore-tests: true
    wrapcheck:
      # Ignore errors from google.golang.org/grpc/status package, because
      # wrapping rewrites the message the client receives.
      extra-ignore-sigs:
        - google.golang.org/grpc/status.Error
        - google.golang.org/grpc/status.Errorf
  exclusions:
    rules:
      # funlen on tests makes it difficult to write table-driven tests.
      - path: _test\.go
        linters: [funlen]

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines
    - swaggo
